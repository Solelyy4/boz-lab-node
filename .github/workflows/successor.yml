name: successor
# Rantaian nod tanpa PC dan tanpa PAT.
#
# `gh workflow run` dari dalam workflow TIDAK mencetuskan run baharu apabila ia
# menggunakan GITHUB_TOKEN — jadi "self-chain" dalam ephemeral-node gagal senyap.
# Kekecualian: peristiwa `workflow_run` MEMANG dicetuskan. Jadi fail ini
# menghidupkan pengganti sebaik sahaja nod lama tamat — jurang hanya masa boot.

on:
  workflow_run:
    workflows: ["ephemeral-node"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: successor
  cancel-in-progress: false

jobs:
  next:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hidupkan nod pengganti
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          # Beri masa kepada GitHub menutup run yang baru tamat, supaya ia tidak
          # dikira sebagai "masih berjalan" oleh semakan di bawah.
          sleep 15
          RUNNING=$(gh run list --workflow=ephemeral-node.yml --limit 8 \
            --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting")] | length')
          echo "nod aktif selepas tamat: $RUNNING"
          if [ "$RUNNING" -gt 0 ]; then
            echo "sudah ada pengganti — langkau (elak dua poller / 409)"
            exit 0
          fi
          gh workflow run ephemeral-node.yml -f minutes=350 -f port=45001
          echo "pengganti dihantar"
