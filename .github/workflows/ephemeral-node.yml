name: ephemeral-node
# Hos Linux percuma atas permintaan: Ubuntu 24.04, sshd + tunnel awam.
# Semua logik ada dalam node.sh — fail yang SAMA boleh dipakai pada VPS sebenar.
# Alamat SSH dilaporkan ke issue "node-status".

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Umur nod dalam minit (maks 350)"
        required: true
        default: "120"

permissions:
  contents: read
  issues: write

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Sediakan nod
        run: |
          set -eux
          bash -n node.sh
          sudo bash node.sh install
          sudo bash node.sh status
          sudo bash node.sh url | tee /tmp/url.txt
          [ -s /tmp/url.txt ] || { echo "::error::tiada alamat"; exit 1; }

      - name: Lapor alamat ke issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          URL=$(cat /tmp/url.txt)
          END=$(date -u -d "+${{ inputs.minutes }} minutes" '+%F %T UTC')
          BODY=$(printf 'Nod hidup. Tamat: %s\n\n```\n%s\n```\n\nRun: %s/%s/actions/runs/%s\n' \
            "$END" "$URL" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          NUM=$(gh issue list --search 'node-status in:title' --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "${NUM:-}" ]; then gh issue close "$NUM" -c "diganti nod baru" >/dev/null 2>&1 || true; fi
          gh issue create --title "node-status" --body "$BODY" >/dev/null
          echo "dilaporkan: $URL"

      - name: Tahan hidup
        run: sleep "$(( ${{ inputs.minutes }} * 60 ))"
