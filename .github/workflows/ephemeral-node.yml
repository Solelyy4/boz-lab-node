name: ephemeral-node
# Nod Linux percuma atas permintaan: Ubuntu 24.04 + sshd + tunnel awam port TETAP.
# node.sh  = sediakan sshd + tunnel (fail sama boleh dipakai pada VPS sebenar)
# state.sh = pulihkan & segerakkan ~/persist supaya kerja tak hilang bila nod berganti
# start.sh = (dalam ~/persist) dipanggil automatik supaya proses kau hidup semula
# Alamat SSH dilaporkan ke issue "node-status".

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Umur nod dalam minit (maks 350)"
        required: true
        default: "340"
      port:
        description: "Port tetap di bore.pub (kosong = rawak)"
        required: false
        default: "45001"

permissions:
  contents: write
  issues: write

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # Langkah ini BLOK sampai tunnel dapat port — jadi bila ia habis,
      # kita sahkan nod ini ialah nod yang hidup (bukan yang menunggu).
      - name: Sediakan nod
        env:
          NODE_PORT: ${{ inputs.port }}
        run: |
          set -eux
          bash -n node.sh
          sudo bash node.sh install --port "$NODE_PORT"
          sudo bash node.sh url | tee /tmp/url.txt
          [ -s /tmp/url.txt ] || { echo "::error::tiada alamat"; exit 1; }

      - name: Pulihkan fail kerja
        continue-on-error: true
        env:
          PERSIST_PASS: ${{ secrets.PERSIST_PASS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: bash state.sh restore

      # Kunci provider datang dari Actions secrets, bukan dari blob simpanan.
      - name: Tulis kunci ke .env
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOKENOMIX_API_KEY: ${{ secrets.TOKENOMIX_API_KEY }}
          TOKENHARBOR_KEY: ${{ secrets.TOKENHARBOR_KEY }}
        run: |
          umask 077
          mkdir -p "$HOME/persist/secrets"
          {
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'GEMINI_API_KEY=%s\n'     "$GEMINI_API_KEY"
            printf 'GROQ_API_KEY=%s\n'       "$GROQ_API_KEY"
            printf 'TOKENOMIX_API_KEY=%s\n'  "$TOKENOMIX_API_KEY"
            printf 'HERMES_HOME=%s\n'        "$HOME/persist"
            printf 'TELEKEY_PORT=8766\n'
          } > "$HOME/persist/.env"
          chmod 600 "$HOME/persist/.env"
          printf '%s' "$TOKENHARBOR_KEY" > "$HOME/persist/secrets/tokenharbor.key"
          chmod 600 "$HOME/persist/secrets/tokenharbor.key"
          echo "kunci ditulis (nilai tidak dicetak): $(wc -l < "$HOME/persist/.env") baris"

      # Simpanan boleh hilang (branch state dipadam / mula dari kosong). Repo
      # ialah salinan kedua: bawa masuk apa yang tiada supaya nod tetap berguna.
      - name: Bootstrap dari repo bila simpanan kosong
        continue-on-error: true
        run: |
          P="$HOME/persist"; mkdir -p "$P"
          # start.sh + make-config.py milik repo, bukan data pengguna: sentiasa
          # segarkan. Kalau tidak, salinan lama dalam blob kekal selamanya dan
          # ciri baharu tidak pernah sampai ke nod.
          cp templates/start.sh "$P/start.sh"; chmod +x "$P/start.sh"
          cp make-config.py "$P/make-config.py"
          # Semak ISI, bukan kewujudan dir: blob lama boleh simpan dir kosong,
          # dan `[ -d ]` akan langkau salinan lalu skills hilang senyap.
          [ -f "$P/telekey/telekey.py" ] || cp -r telekey "$P/telekey"
          mkdir -p "$P/skills"
          cp -r skills/. "$P/skills"/
          echo "bootstrap: $(find "$P/skills" -name SKILL.md 2>/dev/null | wc -l) skill, start.sh=$([ -x "$P/start.sh" ] && echo ada)"

      # Selepas fail pulih barulah proses dijalankan — bot perlukan failnya dahulu.
      - name: Mula semula proses kau
        continue-on-error: true
        run: |
          if [ -x "$HOME/persist/start.sh" ]; then
            nohup bash "$HOME/persist/start.sh" > /tmp/start.log 2>&1 &
            echo "start.sh dijalankan (pid $!)"
            sleep 3
            tail -5 /tmp/start.log || true
          else
            echo "tiada ~/persist/start.sh — langkau"
          fi

      - name: Lapor alamat ke issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          set -eu
          URL=$(cat /tmp/url.txt)
          PORT=$(printf '%s\n' "$URL" | sed -n 's/^ssh -p \([0-9]*\).*/\1/p')
          EXP=$(( $(date -u +%s) + MINUTES * 60 ))
          BODY=$(printf 'EXPIRES_UTC=%s\nPORT=%s\nTamat: %s UTC\n\n```\n%s\n```\n\nRun: %s/%s/actions/runs/%s\n' \
            "$EXP" "$PORT" "$(date -u -d "@$EXP" '+%F %T')" "$URL" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          NUM=$(gh issue list --search 'node-status in:title' --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "${NUM:-}" ]; then gh issue close "$NUM" -c "diganti nod baru" >/dev/null 2>&1 || true; fi
          gh issue create --title "node-status" --body "$BODY" >/dev/null
          echo "dilaporkan: $URL (tamat $EXP)"

      - name: Tahan hidup + segerak fail
        env:
          PERSIST_PASS: ${{ secrets.PERSIST_PASS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          nohup bash state.sh watch > /tmp/state-watch.log 2>&1 &
          echo "segerak fail: pid $!"
          sleep "$(( ${{ inputs.minutes }} * 60 ))"
